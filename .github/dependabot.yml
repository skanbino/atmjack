version: 2
updates:
 - package-ecosystem: "github-actions"
 directory: "/"
 schedule:
 interval: "weekly"
 day: "monday"
 time: "06:00"
 timezone: "UTC"
 open-pull-requests-limit: 5
 groups:
 github-actions:
 patterns:
 - "*"

 - package-ecosystem: "pip"
 directory: "/"
 schedule:
 interval: "weekly"
 day: "monday"
 time: "06:00"
 timezone: "UTC"
 open-pull-requests-limit: 5
 groups:
 python-runtime:
 patterns:
 - "*"
 exclude-patterns:
 - "pytest*"
 - "ruff"
 - "mypy"
 python-dev:
 patterns:
 - "pytest*"
 - "ruff"
 - "mypy"