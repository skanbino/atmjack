<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <title>atmjack</title>
 <style>
:root { color-scheme: dark; }
 body { font-family: system-ui, sans-serif; background: #0d1117; color: #c9d1d9;
 max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
 h1 { color: #58a6ff; font-size: 1.4rem; }
 input, button { font: inherit; padding: 0.5rem 0.75rem; border-radius: 6px;
 border: 1px solid #30363d; background: #161b22; color: inherit; }
 button { cursor: pointer; background: #238636; border-color: #2ea043; }
 #out { margin-top: 1.5rem; white-space: pre-wrap; font-family: ui-monospace, monospace;
 font-size: 0.85rem; background: #161b22; border: 1px solid #30363d;
 border-radius: 6px; padding: 1rem; min-height: 3rem; }
 </style>
</head>
<body>
 <h1>atmjack &mdash; scan console</h1>
 <form id="f">
 <input id="target" placeholder="target (host or CIDR)" required size="32">
 <button type="submit">scan</button>
 </form>
 <div id="out">awaiting target&hellip;</div>
 <script>
 const out = document.getElementById('out');
 document.getElementById('f').addEventListener('submit', async (e) => {
 e.preventDefault();
 const target = document.getElementById('target').value.trim();
 out.textContent = 'submitting ' + target + '...';
 try {
 const r = await fetch('/scans', {
 method: 'POST',
 headers: { 'Content-Type': 'application/json' },
 body: JSON.stringify({ target })
 });
 if (!r.ok) throw new Error('HTTP ' + r.status);
 const accepted = await r.json();
 out.textContent = 'scan ' + accepted.scan_id + ' queued — polling';
 const poll = setInterval(async () => {
 const s = await fetch('/scans/' + accepted.scan_id);
 const rec = await s.json();
 if (rec.state === 'done' || rec.state === 'failed') {
 clearInterval(poll);
 out.textContent = JSON.stringify(rec, null, 2);
 }
 }, 1500);
 } catch (err) {
 out.textContent = 'error: ' + err.message;
 }
 });
 </script>
</body>
</html>
