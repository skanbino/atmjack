[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atmjack"
version = "0.1.0"
description = "ATM/AD recon pipeline: nmap discovery, hydra credential checks, windapsearch AD enumeration, and optional LLM triage."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "ATMJack Maintainers" }]
keywords = ["atm", "smartcard", "apdu", "emv", "security", "llm"]
classifiers = [
 "Development Status:: 3 - Alpha",
 "Intended Audience:: Developers",
 "License:: OSI Approved:: MIT License",
 "Programming Language:: Python:: 3",
 "Programming Language:: Python:: 3.10",
 "Programming Language:: Python:: 3.11",
 "Programming Language:: Python:: 3.12",
 "Programming Language:: Python:: 3.13",
 "Topic:: Security",
]
dependencies = [
 "fastapi>=0.110,<1",
 "uvicorn[standard]>=0.29,<1",
 "pydantic>=2.5,<3",
 "requests>=2.31,<3",
 "pyscard>=2.0,<3",
 "cryptography>=42,<46",
 "PyYAML>=6.0,<7",
 "rich>=13.7,<14",
 "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
 "httpx>=0.27,<1",
 "pytest>=8.0,<9",
 "pytest-cov>=5.0,<7",
 "ruff>=0.6,<1",
 "mypy>=1.11,<2",
 "types-PyYAML>=6.0",
 "types-requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/atmjack/atmjack"
Issues = "https://github.com/atmjack/atmjack/issues"

[project.scripts]
atmjack = "atmjack.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true